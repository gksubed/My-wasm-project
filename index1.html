<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AssemblyScript Prime Checker</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; font-size: 1.2rem; }
        button { padding: 10px 20px; font-size: 1.2rem; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.5rem; }
    </style>
</head>
<body>

    <h1>Wasm Prime Checker</h1>
    <input type="number" id="numInput" value="17">
    <button id="checkBtn">Check Prime</button>
    <div id="result"></div>

    <script type="module">
        // Import the compiled Wasm function from the generated JS glue file
        import { isPrime } from "./build/release.js";

        const btn = document.getElementById('checkBtn');
        const input = document.getElementById('numInput');
        const resultDiv = document.getElementById('result');

        btn.addEventListener('click', () => {
            const val = parseInt(input.value);
            
            // Call the WebAssembly function!
            const isItPrime = isPrime(val);
            
            resultDiv.innerText = isItPrime 
                ? `${val} is a Prime Number! ✅` 
                : `${val} is NOT prime. ❌`;
            
            resultDiv.style.color = isItPrime ? "green" : "red";
        });
    </script>
</body>
</html>
